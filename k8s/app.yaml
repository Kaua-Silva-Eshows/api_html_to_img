apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-send-image-from-operations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-send-image-from-operations
  template:
    metadata:
      labels:
        app: service-send-image-from-operations
    spec:
      containers:
        - name: service-send-image-from-operations
          image: eshows/service-send-image-from-operations:latest
          ports:
            - containerPort: 7000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          env:
            - name: PORT
              value: "7000"

            - name: teste
              value: "https:/picdhaossssssss"

---
apiVersion: v1
kind: Service
metadata:
  name: service-send-image-from-operations-service
spec:
  ports:
    - port: 7000
  selector:
    app: service-send-image-from-operations
  type: ClusterIP